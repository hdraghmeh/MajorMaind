kind = "web"
previewPath = "/"
title = "MajorMind AI"
version = "1.0.0"
id = "artifacts/majormind"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20940

[services.development]
run = "pnpm --filter @workspace/majormind run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/majormind", "run", "build" ]
publicDir = "artifacts/majormind/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20940"
BASE_PATH = "/"
