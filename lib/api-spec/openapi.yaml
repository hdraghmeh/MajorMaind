openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: interview
    description: MajorMind AI interview operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: sessions
    description: Server-side interview session persistence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /interview/start:
    post:
      operationId: startInterview
      tags: [interview]
      summary: Start a new AI interview
      description: |
        Returns the AI advisor's opening greeting and first question. The client should
        treat the returned turn as the first advisor message in a fresh transcript.
      responses:
        "200":
          description: The opening interview turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTurn"
        "500":
          description: AI service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
  /interview/turn:
    post:
      operationId: interviewTurn
      tags: [interview]
      summary: Advance the AI interview by one turn
      description: |
        Submits the full transcript so far (messages between the student and the AI advisor)
        and returns either the next AI question or the final recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewTurnInput"
      responses:
        "200":
          description: The next interview turn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTurn"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
        "500":
          description: AI service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
  /interview/finalize:
    post:
      operationId: finalizeInterview
      tags: [interview]
      summary: Force the AI to produce the final recommendation now
      description: |
        Submits the full transcript so far and asks the AI advisor to produce the final
        recommendation immediately, regardless of whether it would normally have done so.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewFinalizeInput"
      responses:
        "200":
          description: The final interview turn (kind=result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewTurn"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
        "500":
          description: AI service failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
  /interview-result/{sessionId}:
    get:
      operationId: getInterviewResult
      tags: [interview]
      summary: Retrieve a completed interview result by session ID
      description: |
        Returns the completed interview record stored in the database for the given session ID.
        For authenticated-user sessions, the caller must be the same user who conducted the interview.
        For guest sessions, the caller must hold the per-session claim cookie set when the session was created.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Completed interview record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewResultRecord"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewError"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /interview-sessions:
    get:
      operationId: listInterviewSessions
      tags: [sessions]
      summary: List all interview sessions for the authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of stored interview sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionList'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewError'
  /interview-sessions/{sessionId}:
    put:
      operationId: saveInterviewSession
      tags: [sessions]
      summary: Save or update an interview session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewSessionData'
      responses:
        '200':
          description: Session saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionData'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewError'
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InterviewMessage:
      type: object
      properties:
        role:
          type: string
          enum: [student, advisor]
        content:
          type: string
      required:
        - role
        - content
    InterviewTurnInput:
      type: object
      properties:
        messages:
          type: array
          description: The full transcript of the interview so far, oldest first.
          items:
            $ref: "#/components/schemas/InterviewMessage"
        forceFinalize:
          type: boolean
          description: When true, instructs the advisor to produce a final recommendation now.
        profileContext:
          type: string
          description: Optional pre-filled student profile context to inject into the AI system prompt.
        sessionId:
          type: string
          description: Optional session ID to associate the completed interview record with this session.
      required:
        - messages
    InterviewFinalizeInput:
      type: object
      properties:
        messages:
          type: array
          description: The full transcript of the interview so far, oldest first.
          items:
            $ref: "#/components/schemas/InterviewMessage"
        sessionId:
          type: string
          description: Optional session ID to link the finalized record to the active session.
      required:
        - messages
    InterviewProgress:
      type: object
      description: Subtle, non-checklist progress signal (0-100).
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
          description: A short human-readable stage label.
      required:
        - percent
        - stage
    InterviewRecommendation:
      type: object
      properties:
        recommendedMajor:
          type: string
        matchScore:
          type: integer
          minimum: 0
          maximum: 100
        whyItFits:
          type: array
          items:
            type: string
        alternativeMajors:
          type: array
          items:
            type: string
        academicStrengths:
          type: array
          items:
            type: string
        careerAdvice:
          type: array
          items:
            type: string
        closingMessage:
          type: string
        admissionNote:
          type: ["string", "null"]
          description: Optional note about AAUP admission requirements and GPA eligibility.
      required:
        - recommendedMajor
        - matchScore
        - whyItFits
        - alternativeMajors
        - academicStrengths
        - careerAdvice
        - closingMessage
    InterviewTurn:
      type: object
      properties:
        kind:
          type: string
          enum: [question, result]
        question:
          type: ["string", "null"]
          description: The next AI question for the student. Present when kind=question.
        progress:
          $ref: "#/components/schemas/InterviewProgress"
        recommendation:
          oneOf:
            - $ref: "#/components/schemas/InterviewRecommendation"
            - type: "null"
          description: Final recommendation. Present when kind=result.
      required:
        - kind
        - progress
    InterviewError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    InterviewResultRecord:
      type: object
      description: A completed interview record stored in the database.
      properties:
        sessionId:
          type: ["string", "null"]
          description: The session ID this record is linked to.
        recommendation:
          $ref: "#/components/schemas/InterviewRecommendation"
        fullConversation:
          type: array
          items:
            $ref: "#/components/schemas/InterviewMessage"
        savedAt:
          type: string
          format: date-time
        user:
          type: ["object", "null"]
          properties:
            id:
              type: string
            email:
              type: ["string", "null"]
            firstName:
              type: ["string", "null"]
            lastName:
              type: ["string", "null"]
    InterviewSessionData:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        title:
          type: ["string", "null"]
        profileData:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional profile form data captured at each step.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/InterviewMessage"
        progress:
          oneOf:
            - $ref: "#/components/schemas/InterviewProgress"
            - type: "null"
        recommendation:
          oneOf:
            - $ref: "#/components/schemas/InterviewRecommendation"
            - type: "null"
      required:
        - id
        - createdAt
        - updatedAt
        - messages
    InterviewSessionList:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/InterviewSessionData"
      required:
        - sessions
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
